<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mobile First</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            TechStore
        </div>

        <nav>
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">About</a>
        </nav>

    </header>


    <main>

        <section class="hero">

            <div class="hero-content">

                <h1>Technology for Everyone</h1>

                <p>
                    Discover modern technology designed
                    for everyday life.
                </p>

                <button>Explore</button>

            </div>

            <div class="hero-image">

                <img
                    src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=1000"
                    alt="Computer motherboard"
                >

            </div>

        </section>


        <section class="features">

            <div class="card">
                <h2>Powerful</h2>
                <p>Excellent performance for everyday tasks.</p>
            </div>

            <div class="card">
                <h2>Modern</h2>
                <p>Built with modern technology.</p>
            </div>

            <div class="card">
                <h2>Reliable</h2>
                <p>Designed for dependable everyday use.</p>
            </div>

        </section>

    </main>

</body>

</html>
