<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Loops</h1>

    <script>
        for (let i = 0; i < 5; i++) {
            console.log(i);
        }

        console.log("-------------------------------------")

        i = 0

        while (i < 5) {
            console.log(i)
            i++
        }

        console.log("-------------------------------------")
        do {
            console.log(i)
        } while (i < 5)

        console.log("-------------------------------------")

        let person = {Name: "Xtrem", Age: "17"}
        
        for (let i in person) {
            console.log(i, person[i]);
        }
    </script>
</body>
</html>
