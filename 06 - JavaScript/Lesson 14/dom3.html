<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dynamic DOM</title>
</head>

<body>

    <div id="container"></div>

    <script>
        const container = document.getElementById("container");
        let heading = document.createElement("h1");
        let paragraph = document.createElement("p");
        let p2 = document.createElement("p");
        let button = document.createElement("button");
        button.classList.add("delete-btn");

        heading.textContent = "My Dynamic Website";
        paragraph.textContent = "This paragraph was created using JavaScript.";
        p2.textContent = "This is another paragraph.";
        button.textContent = "Delete Paragraph";

        container.appendChild(heading);
        container.appendChild(paragraph);
        container.insertBefore(p2, paragraph);
        container.appendChild(button);

        // paragraph.remove();

    </script>

</body>

</html>
