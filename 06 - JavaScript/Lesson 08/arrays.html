<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 11: Arrays</title>
</head>

<body>
    <h1>Arrays</h1>

    <script>
        let numbers = [10, 20, 30, 40, 50]

        console.log(numbers.length)
        numbers.push(60)
        numbers.shift()
        console.log(numbers.includes(30))
        console.log([...numbers])
    </script>
</body>

</html>
