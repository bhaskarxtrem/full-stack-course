<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops through arrays</title>
</head>
<body>
    <script>
        let num = ["Gold", "Silver", "Copper"]

        // for (let index = 0; index < num.length; index++) {
        //     const element = num[index];
        //     console.log(element)            
        // }
        num.forEach((value, index, num) => {
            console.log(`Rank ${index + 1}: ${value}`)
        });

        console.log("-------------------------------")

        for (const i in num) {
            const element = num[i]
            console.log(element)
        }

        console.log("--------------------------------")

        for (const i of num) {
            console.log(i)
        }
    </script>
</body>
</html>
