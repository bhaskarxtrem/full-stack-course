<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Functions</h1>

    <script>
        const add = (a, b) => a + b;

        console.log(add(5,7))

        console.log("-----------------------------------------")

        const multiply = function(a,b) {
            return a * b;
        };

        console.log(multiply(4, 7))

        console.log("-----------------------------------------")

        const divide = (a, b) => {
            return a / b;
        };

        console.log(divide(10, 2))
    </script>
</body>
</html>
