<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 10: Scope & Hoisting</title>
</head>

<body>
    <h1>Scope & Hoisting</h1>

    <script>
        console.log(hlo());

        function hlo() {
            return "Hello!";
        }
        
        console.log("---------------------------------")
        
        function greet() {
            let message = "How are you";
            console.log(message);
        }

        greet();
        console.log(message);

        </script>
</body>

</html>
