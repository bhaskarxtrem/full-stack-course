<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects in JavaScript</title>
</head>

<body>
    <script>
        const laptop = {
            brand: "Lenovo",
            model: "LOQ",
            price: 80000,

            showInfo: function () {
                console.log("Brand: " + this.brand);
                console.log("Model: " + this.model);
                console.log("Price: " + this.price);
            }

        }

        laptop.showInfo();

        console.log("---------------------------------------");

        const laptop2 = {
            brand: "Lenovo",
            model: "LOQ",
            price: 80000,

            showInfo: function () {
                console.log(this.brand + " " + this.model);
            }
        };

        laptop2.brand = "ASUS";
        laptop2.model = "TUF";

        laptop2.showInfo();

    </script>
</body>

</html>
